group = "com.redevrx.flutter_phone_call_state"
version = "1.0-SNAPSHOT"

buildscript {
    ext.kotlin_version = "2.4.0"
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath("com.android.tools.build:gradle:9.1.0")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version")
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: "com.android.library"

// Built-in Kotlin migration.
//
// On AGP 9 Kotlin comes from AGP's built-in support; when an app opts out with
// `android.builtInKotlin=false`, Flutter's Gradle plugin applies KGP to this
// subproject for us. Only AGP 8 needs us to apply it ourselves.
//
// Must NOT be spelled `apply plugin: "kotlin-android"`: Flutter detects KGP
// usage with a regex over this file's raw text, so even a conditional
// `apply plugin:` line keeps the "plugins that apply Kotlin Gradle Plugin"
// warning alive. `pluginManager.apply` is invisible to that regex.
// https://docs.flutter.dev/release/breaking-changes/migrate-to-built-in-kotlin/for-plugin-authors
def agpMajor = com.android.Version.ANDROID_GRADLE_PLUGIN_VERSION.tokenize('.')[0] as int
if (agpMajor < 9) {
    pluginManager.apply("kotlin-android")
}

android {
    if (project.android.hasProperty("namespace")) {
        namespace = "com.redevrx.flutter_phone_call_state"
    }

    compileSdk = 36

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    sourceSets {
        main.java.srcDirs += "src/main/kotlin"
        test.java.srcDirs += "src/test/kotlin"
    }

    defaultConfig {
        minSdk = 24
    }

    testOptions {
        unitTests.all {
            useJUnitPlatform()

            testLogging {
               events "passed", "skipped", "failed", "standardOut", "standardError"
               outputs.upToDateWhen {false}
               showStandardStreams = true
            }
        }
    }
}

// Replaces the old `android.kotlinOptions` block. Kotlin reaches this project
// from AGP (built-in), from Flutter (when builtInKotlin=false) or from us
// (AGP 8) — and never before this file is evaluated — so react to the plugin
// instead of calling `kotlin { }` eagerly.
plugins.withId("org.jetbrains.kotlin.android") {
    kotlin {
        compilerOptions {
            jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
        }
    }
}

dependencies {
    testImplementation("org.jetbrains.kotlin:kotlin-test")
    testImplementation("org.mockito:mockito-core:5.0.0")
}
